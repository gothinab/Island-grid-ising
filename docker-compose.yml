name: grid-ising

services:
  app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro      # graphml-файлы остаются на вашем диске
      - ./results:/app/results   # сюда пишет CLI
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
