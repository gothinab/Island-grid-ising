[project]
name = "ising-model"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gothinab", email = "sokolov_sasha0238@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
ising-model = "grid_ising.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[tool.uv.build-backend]
module-name = "grid_ising"
